<!DOCTYPE html>
<html lang="en">

<head>
  <base href="../">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Demo 1 - Themes</title>

  <link href="examples/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/teckgeekz-consent@3.1.5/build/cookieconsent.min.css" rel="stylesheet">

<body role="document">

  <div class="demo-topbar">
    <div class="brand">teckgeekz-<span>consent</span></div>
    <div>
      <a href="examples/index.html">&larr; Back to All Demos</a> &bull;
      <a href="https://teckgeekz.com" target="_blank" rel="noopener noreferrer">teckgeekz.com</a>
    </div>
  </div>

  <div class="center-outer fit">
    <div class="center-inner">
      <div class="example-window" role="main" style="padding-top: 60px;">

        <h1>
          <span>Demo 1</span> Themes
        </h1>

        <p>
          Explore pre-configured color palettes and themes in
          <a href="https://teckgeekz.com" target="_blank" rel="noopener noreferrer">teckgeekz-consent</a>:
        </p>

        <ul class="example-selector"></ul>

        <a href="examples/index.html" class="page-switcher page-switcher-prev" title="Back to Index">&#9664;</a>
        <a href="examples/example-2-custom-theme.html" class="page-switcher page-switcher-next"
          title="Next demo">&#9654;</a>

      </div>
    </div>
  </div>

  <script src="examples/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/teckgeekz-consent@3.1.5/build/cookieconsent.min.js"></script>
  <script>

    (function (C, U) {

      var palettes = {
        honeybee: { "popup": { "background": '#000' }, "button": { "background": '#f1d600', padding: '5px 25px' } },
        blurple: { "popup": { "background": '#3937a3' }, "button": { "background": '#e62576' } },
        mono: { "popup": { "background": "#237afc" }, "button": { "background": "transparent", "border": "#fff", "text": "#fff", padding: '5px 40px' } },
        nuclear: { "popup": { "background": "#aa0000", "text": "#ffdddd" }, "button": { "background": "#ff0000" } },
        cosmo: { "popup": { "background": "#383b75" }, "button": { "background": "#f1d600", padding: '5px 50px' } },
        neon: { "popup": { "background": "#1d8a8a" }, "button": { "background": "#62ffaa" } },
        corporate: { "popup": { "background": "#edeff5", "text": "#838391" }, "button": { "background": "#4b81e8" } }
      };

      cookiePopups = U.initialisePopupSelector({
        cookieconsent: C,
        selector: document.querySelector('.example-selector'),
        popups: {
          'Teckgeekz (Flagship)': {
            type: 'opt-in-customize',
            position: 'bottom',
            theme: 'teckgeekz',
            content: {
              message: "Experience the modern dark glassmorphic design by Teckgeekz.",
              allow: "Accept All",
              deny: "Reject All",
              customize: "Cookie Settings",
              link: "Learn more",
              href: "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Cookies"
            }
          },
          'Mono': {
            type: 'info',
            position: 'bottom',
            palette: palettes.mono,
          },
          'Honeybee': {
            type: 'info',
            position: 'top',
            palette: palettes.honeybee,
          },
          'Blurple': {
            type: 'opt-out',
            position: 'bottom-left',
            palette: palettes.blurple,
            content: {
              "message": "You can override the text that appears in an alert too.",
              "dismiss": "Awesome"
            }
          },
          'Nuclear': {
            type: 'info',
            position: 'bottom-right',
            theme: "edgeless",
            palette: palettes.nuclear,
            content: {
              "dismiss": "I accept certain doom"
            }
          },
          'Cosmo': {
            type: 'opt-out',
            position: 'bottom',
            palette: palettes.cosmo,
          },
          'Neon': {
            type: 'info',
            theme: "classic",
            position: 'bottom-left',
            palette: palettes.neon,
          },
          'Corporate': {
            type: 'info',
            position: 'top',
            palette: palettes.corporate,
            static: true,
            content: {
              "dismiss": "Dismiss"
            }
          }
        },
      });
    }(window.cookieconsent, window.cookieconsent_example_util));

  </script>
